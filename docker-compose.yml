services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tcache-internal

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tcache
      POSTGRES_USER: tcache
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tcache -d tcache']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tcache-internal

  tcache-server:
    build:
      context: .
      dockerfile: deploy/docker/server.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TCACHE_PORT: 3200
      REDIS_URL: redis://redis:6379
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-dev}
      ROUTE_JOB_TTL_SECONDS: ${ROUTE_JOB_TTL_SECONDS:-86400}
      ROUTE_CACHE_TTL_SECONDS: ${ROUTE_CACHE_TTL_SECONDS:-3600}
      ROUTE_PROVIDER_TIMEOUT_MS: ${ROUTE_PROVIDER_TIMEOUT_MS:-30000}
      TCACHE_MATRIX_CONCURRENCY: ${TCACHE_MATRIX_CONCURRENCY:-4}
      ROUTE_PROVIDER: ${ROUTE_PROVIDER:-auto}
      ROUTE_PROVIDER_POLICY_JSON: ${ROUTE_PROVIDER_POLICY_JSON:-}
      JAPAN_TRANSIT_PROVIDER: ${JAPAN_TRANSIT_PROVIDER:-ekispert}
      ROUTE_PROVIDER_OVERRIDE_ENABLED: ${ROUTE_PROVIDER_OVERRIDE_ENABLED:-false}
      ROUTE_PROVIDER_RAW_DEBUG_ENABLED: ${ROUTE_PROVIDER_RAW_DEBUG_ENABLED:-false}
      ROUTE_TIME_ZONE: ${ROUTE_TIME_ZONE:-Asia/Seoul}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_MOBILITY_API_KEY: ${KAKAO_MOBILITY_API_KEY:-}
      NAVITIME_API_KEY: ${NAVITIME_API_KEY:-}
      NAVITIME_API_BASE_URL: ${NAVITIME_API_BASE_URL:-https://navitime-route-totalnavi.p.rapidapi.com}
      EKISPERT_API_KEY: ${EKISPERT_API_KEY:-}
      EKISPERT_API_BASE_URL: ${EKISPERT_API_BASE_URL:-https://api.ekispert.jp}
      AI_JOB_TTL_SECONDS: ${AI_JOB_TTL_SECONDS:-86400}
      AI_CACHE_DEFAULT_TTL_SECONDS: ${AI_CACHE_DEFAULT_TTL_SECONDS:-3600}
      AI_PROVIDER_TIMEOUT_MS: ${AI_PROVIDER_TIMEOUT_MS:-120000}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENWEBUI_BASE_URL: ${OPENWEBUI_BASE_URL:-}
      OPENWEBUI_API_KEY: ${OPENWEBUI_API_KEY:-}
      OPENWEBUI_MODEL: ${OPENWEBUI_MODEL:-}
    ports:
      - '127.0.0.1:${TCACHE_PORT:-3200}:3200'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3200/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tcache-internal

  tcache-testbed:
    build:
      context: .
      dockerfile: deploy/docker/testbed.Dockerfile
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${TCACHE_TESTBED_PORT:-3201}:80'
    depends_on:
      tcache-server:
        condition: service_healthy
    networks:
      - tcache-internal

volumes:
  redis-data:
  postgres-data:

networks:
  tcache-internal:
    driver: bridge
