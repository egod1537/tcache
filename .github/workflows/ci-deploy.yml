name: CI and Deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: [self-hosted, macOS]
    environment:
      name: production
      url: https://tcache.mangagaki.net
    concurrency:
      group: tcache-production
      cancel-in-progress: false
    env:
      GIT_COMMIT_SHA: ${{ github.sha }}
      TCACHE_PORT: ${{ vars.TCACHE_PORT || '3200' }}
      TCACHE_TESTBED_PORT: ${{ vars.TCACHE_TESTBED_PORT || '3201' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ROUTE_PROVIDER: ${{ vars.ROUTE_PROVIDER || 'google' }}
      ROUTE_TIME_ZONE: ${{ vars.ROUTE_TIME_ZONE || 'Asia/Seoul' }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
      OPENWEBUI_BASE_URL: ${{ vars.OPENWEBUI_BASE_URL }}
      OPENWEBUI_API_KEY: ${{ secrets.OPENWEBUI_API_KEY }}
      OPENWEBUI_MODEL: ${{ vars.OPENWEBUI_MODEL }}
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true

      - name: Build images
        run: docker compose build

      - name: Start services
        run: docker compose up -d --remove-orphans

      - name: Verify deployment
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent "http://127.0.0.1:${TCACHE_PORT}/health" >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --tail=100 tcache-server
          exit 1
