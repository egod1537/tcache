name: CI and Deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: [self-hosted, macOS]
    environment:
      name: production
      url: https://tcache.mangagaki.net
    concurrency:
      group: tcache-production
      cancel-in-progress: false
    env:
      GIT_COMMIT_SHA: ${{ github.sha }}
      TCACHE_PORT: ${{ vars.TCACHE_PORT || '3200' }}
      TCACHE_TESTBED_PORT: ${{ vars.TCACHE_TESTBED_PORT || '3201' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ROUTE_PROVIDER: ${{ vars.ROUTE_PROVIDER || 'auto' }}
      ROUTE_PROVIDER_POLICY_JSON: ${{ vars.ROUTE_PROVIDER_POLICY_JSON }}
      ROUTE_PROVIDER_OVERRIDE_ENABLED: ${{ vars.ROUTE_PROVIDER_OVERRIDE_ENABLED || 'true' }}
      ROUTE_TIME_ZONE: ${{ vars.ROUTE_TIME_ZONE || 'Asia/Seoul' }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_MOBILITY_API_KEY: ${{ secrets.KAKAO_MOBILITY_API_KEY }}
      EKISPERT_API_KEY: ${{ secrets.EKISPERT_API_KEY }}
      NAVITIME_API_KEY: ${{ secrets.NAVITIME_API_KEY }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
      OPENWEBUI_BASE_URL: ${{ vars.OPENWEBUI_BASE_URL }}
      OPENWEBUI_API_KEY: ${{ secrets.OPENWEBUI_API_KEY }}
      OPENWEBUI_MODEL: ${{ vars.OPENWEBUI_MODEL }}
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true

      - name: Verify production provider configuration
        run: |
          if [[ "${ROUTE_PROVIDER}" != "auto" ]]; then
            echo "ROUTE_PROVIDER must be auto in production; got ${ROUTE_PROVIDER:-unset}" >&2
            exit 1
          fi
          if [[ "${ROUTE_PROVIDER_OVERRIDE_ENABLED}" != "true" ]]; then
            echo "ROUTE_PROVIDER_OVERRIDE_ENABLED must be true for troute integration" >&2
            exit 1
          fi

          missing=()
          for name in GOOGLE_MAPS_API_KEY KAKAO_REST_API_KEY KAKAO_MOBILITY_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required production route provider secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Build images
        run: docker compose build

      - name: Start services
        run: docker compose up -d --remove-orphans

      - name: Verify deployment
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent "http://127.0.0.1:${TCACHE_PORT}/health" >/dev/null; then
              break
            fi
            if [[ "${attempt}" == "20" ]]; then
              docker compose ps
              docker compose logs --tail=100 tcache-server
              exit 1
            fi
            sleep 3
          done

          docker compose exec -T tcache-server node --input-type=module <<'NODE'
          const response = await fetch('http://127.0.0.1:3200/api/route/providers/policy');
          if (!response.ok) throw new Error(`Provider policy returned HTTP ${response.status}`);
          const body = await response.json();
          if (body.routeProviderMode !== 'auto') {
            throw new Error(`Expected routeProviderMode=auto, got ${body.routeProviderMode}`);
          }
          if (body.policySource !== 'built-in') {
            throw new Error(`Expected built-in policy, got ${body.policySource}`);
          }
          if (body.legacyCompatibilityApplied) {
            throw new Error('Deprecated JAPAN_TRANSIT_PROVIDER override is active');
          }
          if (!body.providerOverrideEnabled) {
            throw new Error('Expected request-level provider overrides to be enabled');
          }
          const expected = new Map([
            ['JP:TRANSIT', { provider: 'ekispert', requiredAvailable: false }],
            ['JP:WALKING', { provider: 'google', requiredAvailable: true }],
            ['KR:TRANSIT', { provider: 'kakao-maps', requiredAvailable: true }],
            ['KR:DRIVING', { provider: 'kakao-mobility', requiredAvailable: true }],
          ]);
          for (const assignment of body.assignments) {
            const key = `${assignment.countryCode}:${assignment.mode}`;
            if (!expected.has(key)) continue;
            const expectation = expected.get(key);
            if (
              assignment.provider !== expectation.provider ||
              (expectation.requiredAvailable && !assignment.available)
            ) {
              throw new Error(
                `Invalid ${key} assignment: expected ${expectation.provider}, got ${assignment.provider} available=${assignment.available}`,
              );
            }
            expected.delete(key);
          }
          if (expected.size) {
            throw new Error(`Missing provider assignments: ${[...expected.keys()].join(', ')}`);
          }
          console.log('Production route provider policy verified: auto, overrides enabled, core providers available');
          NODE
